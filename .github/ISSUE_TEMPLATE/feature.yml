name: 작업 이슈
description: 기능/버그/작업 단위를 기록하기 위한 템플릿입니다.
body:
  - type: markdown
    attributes:
      value: |
        ## 기능 설명
        추가하려는 기능에 대해 간결하게 설명해주세요.

  - type: textarea
    id: details
    attributes:
      label: 작업 상세 내용
      description: 구현할 내용을 적어주세요.
      placeholder: |
        - [ ] TODO
        - [ ] TODO
        - [ ] TODO
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고할만한 자료
      description: 참고 링크나 자료가 있으면 적어주세요.
      placeholder: 링크나 참고 자료를 입력하세요.
